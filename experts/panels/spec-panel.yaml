# tenet-bypass: do-no-harm — user-approved cross-project change (session stamped 20_CONSIGLIERE, panel config lives in 20_agentflow by design): formalize the operator-surface checklist from feedback_spec_cli_a2a_readiness_checklist into the panel
name: spec-panel
description: "Multi-expert specification review — quality gate for Refining → Ready"

modes:
  - discussion
  - critique
  - socratic

focus-areas:
  - name: requirements
    description: "Requirement clarity, completeness, testability"
    lead: karl-wiegers
    experts: [karl-wiegers, gojko-adzic, alistair-cockburn]

  - name: architecture
    description: "Interface design, boundaries, scalability, patterns"
    lead: martin-fowler
    experts: [martin-fowler, sam-newman, gregor-hohpe, michael-nygard]

  - name: testing
    description: "Test strategy, coverage, edge cases, acceptance criteria"
    lead: lisa-crispin
    experts: [lisa-crispin, janet-gregory, gojko-adzic]

  - name: compliance
    description: "Regulatory coverage, security, operational requirements"
    lead: karl-wiegers
    experts: [karl-wiegers, michael-nygard, kelsey-hightower]

default-experts: [karl-wiegers, gojko-adzic, martin-fowler, lisa-crispin]

max-experts: 7

auto-select:
  - keywords: [api, rest, graphql, microservice, distributed]
    add: [sam-newman]
  - keywords: [cloud, deploy, k8s, kubernetes, docker, infrastructure]
    add: [kelsey-hightower]
  - keywords: [messaging, event, queue, pubsub, integration]
    add: [gregor-hohpe]
  - keywords: [reliability, failure, circuit, resilience, production]
    add: [michael-nygard]
  - keywords: [llm, prompt, codex, claude, gpt, agent, ai, model, hook, rag, embedding]
    add: [simon-willison]
  - keywords: [cli, external, third-party, adapter, container, telemetry, observability, sre]
    add: [charity-majors]

# Mandatory pre-scoring checks (deterministic, not LLM-delegated)
pre-scoring-checks:
  - name: table-reconciliation
    description: |
      Before any expert scores, extract every numeric claim from the spec's tables
      (counts, totals, "≥ N", "= N", "exactly N"). For each numeric claim, verify
      it reconciles with the enumerated items in other sections. Flag arithmetic
      mismatches as CRITICAL findings BEFORE expert deliberation begins. This
      compensates for the known LLM failure mode of hallucinating arithmetic
      consistency over freeform tables.
    when: spec contains 2+ tables with numeric values

  - name: operator-surface-completeness
    description: |
      Before any expert scores, run the three-point operator-surface checklist:
      (1) CLI surface — enumerate every operator verb the ACs imply anywhere in
          prose ("the operator completes / reviews / dismisses / labels ...")
          and verify each has a NAMED command in the spec. A service function
          existing internally is not the same as it being operator-reachable.
      (2) Launchpad/menu wiring — identify the target project's launchpad or
          menu registry mechanism (e.g. Consigliere's hand-maintained MenuItem
          tree in cli/menu.py: Typer `app.add_typer` alone does NOT surface a
          command in the interactive menu; other projects have equivalents —
          grep for the mechanism before assuming none exists). Verify every new
          command is added to it, matching that mechanism's existing structural
          pattern (flat list vs nested submenu), not inventing new structure.
      (3) A2A readiness — ask whether the new capability should be discoverable
          and invocable by other agents/services (registry entry, discoverable
          schema, standard invocation contract — the a2a-cli-registry pattern).
          If yes, the registry entry must be an explicit AC, not an afterthought.
      Flag each miss as a MAJOR finding BEFORE expert deliberation begins.
      Rationale: persona panels verify internal coherence and code-fact
      accuracy — none of them is scoped to operator-surface completeness or
      agent discoverability. This systematic blind spot let a spec ship with 3
      missing CLI commands and zero launchpad wiring through two full review
      rounds (teach-loop spec, 20_CONSIGLIERE, 2026-08-01). This step is
      mechanical, executed by the panel runner, not by an expert voice.
    when: spec introduces or modifies any operator-facing capability (new commands, endpoints, services, DAGs, workflows)

scoring:
  min: 0
  max: 10
  pass-threshold: 7.0
  dimensions:
    - name: clarity
      description: "Language precision and understandability"
    - name: completeness
      description: "Coverage of essential specification elements"
    - name: testability
      description: "Measurability and validation capability"
    - name: consistency
      description: "Internal coherence and contradiction detection"
    - name: operator-surface
      description: |
        Is every capability the spec introduces reachable by both of its
        consumers? (1) The human operator: every implied operator verb has a
        named CLI command AND a launchpad/menu entry — a command that is only
        --help-discoverable is not shipped for a human. (2) Other agents: when
        the capability should be agent-invocable, an a2a registry entry /
        discoverable schema is an explicit AC. Score directly from the
        operator-surface-completeness pre-scoring check: each unaddressed miss
        caps this dimension below the pass threshold; a spec with no
        operator-facing surface at all scores this dimension N/A (excluded
        from the overall average, noted in output).
    - name: public-readiness
      description: |
        Would this spec survive being opened on a public GitHub repo without
        earning ridicule from a competent stranger? Two lenses:
        (1) OSS hygiene — does it call for a README, LICENSE, runnable
            install/usage steps, at least one worked example, and tests/CI?
            Is anything missing that a reviewer judges in the first 30 seconds?
        (2) Design credibility — are there amateur tells? Hardcoded absolute
            paths, secrets in code, no error handling, bare excepts, reinvented
            stdlib, no separation of concerns, "happy path only". Flag each as
            a finding the same way other dimensions do.
        Weight by actual public intent: a clearly internal-only spec should
        not be hammered for lacking public packaging. Score low when the spec
        would embarrass the author in public; high when a skeptical peer would
        say "this is solid, I'd star it."

  # Production-readiness dimensions — applied ONLY when the spec describes
  # an LLM-app, multi-agent pipeline, spec-gated workflow, or AI-driven tool.
  # Trigger keywords overlap with the simon-willison / charity-majors auto-select rules above.
  # Source: ~/projects/00_Governance/PRODUCTION-READINESS-CHECKLIST.md §3, §4, §8.
  # Cross-cutting failures (KP-3681..3685, section 48) inform the rubric.
  ai-production-dimensions:
    enabled-when:
      any-keyword: [llm, prompt, codex, claude, gpt, agent, rag, embedding, multi-agent, pipeline, model]
    pass-threshold: 7.0
    dimensions:
      - name: output-integrity
        description: |
          Are outputs validated against a written schema before downstream use?
          Are tool-internal artifacts in LLM output (<thinking>, **Drafting**, reasoning
          preambles) detected and stripped or treated as validation failures? Are
          multi-source file writes atomic (tempfile + rename, not append-and-pray)?
          Does the system refuse malformed output rather than producing slightly-wrong
          output that propagates silently?
        source: "PRODUCTION-READINESS-CHECKLIST.md §3"
      - name: isolation-enforcement
        description: |
          When the design depends on agents being "independent", is that independence
          TECHNICALLY ENFORCED (separate processes, filesystems, context windows) or
          merely prompt-instructed (anti-pattern KP-3682)? When a shared resource exists
          (context bundle, scratch dir, message bus), are the symmetry constraints
          documented? Are sycophancy / framing / position effects between agents
          acknowledged and either measured or mitigated by architecture?
        source: "PRODUCTION-READINESS-CHECKLIST.md §4"
      - name: security-boundaries
        description: |
          Are "read-only" claims backed by OS-level enforcement (immutable bind-mount,
          chmod a-w, separate user) OR labeled "intended read-only, not hard-enforced"?
          Are third-party plugins / MCP servers / extensions inventoried with bounded
          write surface? Are mode transitions (one mode has FS access, another
          restricts it) auditable? Is there defense-in-depth — at least two
          independent layers stop the worst-case write/leak, not one?
        source: "PRODUCTION-READINESS-CHECKLIST.md §8"

output:
  default-format: standard
  include-scores: true
  include-roadmap: true
  include-consensus: true
